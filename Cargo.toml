[package]
name = "sensirion-core"
version = "0.1.0"
edition = "2024"

[dependencies]
bytes = { version = "1.10.0", default-features = false }
embedded-hal = "1.0.0"
sensirion-i2c = { version = "0.4.0"}
embedded-hal-async = { version = "1.0.0", optional = true }
log = { version = "0.4.26", optional = true, default-features = false }

[dev-dependencies]
assert_matches = "1.5.0"
embedded-hal-mock = "0.11.1"
futures = { version = "0.3.31", default-features = false, features = ["executor"] }

[features]
default = []
embedded-hal-async = ["dep:embedded-hal-async", "embedded-hal-mock/embedded-hal-async", "sensirion-i2c/embedded-hal-async"]
log = ["dep:log"]
